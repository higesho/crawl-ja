<p><b>ナーフ</b>(nerf、弱体化)とは、ゲームのある要素の魅力や効果を下げる変更のこと。そうした変更をすることを指す動詞としても使う。柔らかくて大けがをしにくい NERF ブランドのおもちゃにちなんだ言葉だ。
</p>
