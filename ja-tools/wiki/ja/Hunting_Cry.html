<p><b>狩猟の喊声</b>はモンスター専用の呪文で、大きな<a href="/Noise" title="Noise">騒音</a>を立て、同じ<a href="/Type" title="Type">系統</a>のほかのモンスターにこちらの居場所を知らせる。この知らせは、1 ターンだけ<a href="/Mark" class="mw-redirect" title="Mark">標的状態</a>にされるのと同じ働きをするが、伝わるのは同じ系統のモンスターだけだ。
</p><p>狩猟の喊声を唱えるモンスターは次のとおり。
