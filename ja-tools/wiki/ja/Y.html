<h2><span class="mw-headline" id="Commands">コマンド</span></h2>
<ul><li><b>y</b> を押すと、キャラクターが左上へ 1 マス<a href="/Movement" title="Movement">移動</a>する。</li>
<li><b>shift+y</b> を押すと、<a href="/Monster" title="Monster">モンスター</a>など気になるものに出くわすまで、この方向へ移動しつづける。</li></ul>
<h2><span class="mw-headline" id="Symbols">記号</span></h2>
<p>コンソール版では次のようになる。
</p>
<ul><li><b>y</b> は<a href="/Vampire_mosquito" title="Vampire mosquito">蚊</a>のような飛ぶ虫を表す。</li>
<li><b>Y</b> は<a href="/Yak" title="Yak">ヤク</a>や<a href="/Elephant" title="Elephant">象</a>を表す。</li></ul>
