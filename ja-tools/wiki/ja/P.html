<h2><span class="mw-headline" id="Commands">コマンド</span></h2>
<ul><li><b>p</b> を押すと、<a href="/Quiver" class="mw-redirect" title="Quiver">セット</a>してある行動を実行する。狙う必要がある行動なら、いちばん近い有効な目標を自動で狙う。</li>
<li><b>P</b> は<a href="/Jewellery" title="Jewellery">装身具</a>を身につけるコマンドだ。</li></ul>
<h2><span class="mw-headline" id="Symbols">記号</span></h2>
<p>コンソール版では次のようになる。
</p>
<ul><li><b>p</b> は<a href="/List_of_humans" title="List of humans">人間</a>系のモンスターを表す。</li>
<li><b>P</b> は<a href="/List_of_plants" title="List of plants">動かない植物</a>系のモンスターを表す。</li></ul>
<h2><span class="mw-headline" id="History">変更履歴</span></h2>
<p><a href="/0.19" title="0.19">0.19</a> より前は、<b>p</b> は<a href="/Pray" title="Pray">祈る</a>コマンドだった。
</p>
