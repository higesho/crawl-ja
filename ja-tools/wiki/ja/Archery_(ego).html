<h2><span class="mw-headline" id="Desirability">評価</span></h2>
<p>残念ながら、腕力と甲冑スキルにいくらか注ぎこまないと、攻撃の所要時間はやはり目に見えて長くなるだろう。このエゴは、ほかの追加効果と組み合わさったアーティファクトについているほうが、ふつうの鎖かたびらやプレートアーマーについているよりずっと価値がある。
</p>
