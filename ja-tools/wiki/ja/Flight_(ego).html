<p><b>飛行</b>(<b>flying</b>)は、その品を身に着けているあいだ<a href="/Fly" title="Fly">飛行</a>できるようになる<a href="/Ego" title="Ego">エゴ</a>だ。飛んでいれば<a href="/Water" title="Water">水</a>や<a href="/Lava" title="Lava">溶岩</a>の上に浮かんでいられ、その影響をまったく受けない。
</p><p>飛行のエゴがつくのは次のもの。
