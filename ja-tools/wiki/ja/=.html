<h2><span class="mw-headline" id="Commands">コマンド</span></h2>
<ul><li><b>=</b> を押すと、<b>i</b>(アイテム)、<b>s</b>(呪文)、<b>a</b>(能力)に割り当てられたキーを入れ替えられる。よく使う武器を <b>a</b> と <b>b</b> に割り当てておけば ' (アポストロフィ)ですばやく持ち替えられるし、うっかり唱えたくない呪文を押しそうにないキーへ追いやっておくこともできる。</li></ul>
