<p><b>ツィツィミトルの召喚</b>はモンスター専用の呪文で、<a href="/Tzitzimitl" title="Tzitzimitl">ツィツィミトル</a>を1体呼び出す。
</p><p>ツィツィミトルの召喚を唱える敵は次のとおり。
</p>
<ul><li> <span class="nhsym clr-white">&amp;</span> <a href="/File:Ereshkigal.png" class="image"><img alt="Ereshkigal.png" src="/images/a/a8/Ereshkigal.png" width="32" height="48" /></a> <b><a href="/Ereshkigal" title="Ereshkigal">エレシュキガル</a></b></li></ul>
<p>エレシュキガルがこの呪文で呼び出したモンスターを維持できるのは最大3体までだ。
</p>
