<h2><span class="mw-headline" id="Desirability">評価</span></h2>
<p>残念ながら、腕力と甲冑スキルにいくらか注ぎこまないと、呪文の失敗率はやはり目に見えて上がるだろう。前線に立ち続けたいハイブリッドな召喚術師には、まさにうってつけのエゴかもしれない。
</p>
