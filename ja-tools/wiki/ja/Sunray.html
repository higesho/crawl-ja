<p><b>陽光</b>はモンスター専用の<a href="/Conjurations" title="Conjurations">妖術</a>の呪文で、レベル6の呪文に並ぶダメージを与える。<a href="/Vampire" title="Vampire">吸血鬼</a>には追加のダメージを与えるが、<a href="/Invisible" title="Invisible">透明</a>なプレイヤーは狙えない。命中はやや不正確だが、<a href="/Repel_Missiles" title="Repel Missiles">飛び道具反発</a>と<a href="/Deflect_Missiles" title="Deflect Missiles">飛来物の阻止</a>を無視する。
</p><p>陽光を唱えるモンスターは次のとおり。
