</i>
<table style=" width:auto; text-align:left">

<tr>
<td>
</td>
<td style="width: 100%"> 着用者の甲冑のスキルに比例して、召喚術の呪文の威力と成功率を高める。
</td></tr></table>
<p><b>統率</b>は防具の<a href="/Ego" title="Ego">エゴ</a>で、重い<a href="/Body_armour" class="mw-redirect" title="Body armour">胴鎧</a>(<a href="/Scale_mail" title="Scale mail">スケイルメイル</a>以上の重さのもの、<a href="/Scales_of_the_Dragon_King" title="Scales of the Dragon King">竜王の鱗</a>)にだけつく。<a href="/Armour" title="Armour">甲冑</a>のスキルに比例して<a href="/Summonings" title="Summonings">召喚術</a>の呪文を強化する。
</p>
<ul><li>素の<a href="/Spell_power" class="mw-redirect" title="Spell power">呪文の威力</a>に x<code>(1 + Armour/27)</code> の倍率がかかる。</li>
<li><a href="/Spell_Success#Modifiers" title="Spell Success">素の失敗率</a>に x<code>18 / (18 + Armour)</code> がかかる。素の失敗率は実際の失敗率とは別物なので注意。参考までに、<a href="/Wizardry" title="Wizardry">魔術強化</a>を0から1段階にすると、素の失敗率は x75% になる。</li></ul>
