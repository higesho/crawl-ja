<h2><span class="mw-headline" id="Commands">コマンド</span></h2>
<ul><li><b>q</b> は<a href="/Potion" title="Potion">薬</a>を<a href="/Quaff" title="Quaff">飲む</a>コマンドだ。</li>
<li><b>Q</b> は、射撃に使う矢弾を<a href="/Quiver" class="mw-redirect" title="Quiver">セット</a>するコマンドだ。</li>
<li><b>Ctrl-q</b> はゲームを<a href="/Quit" title="Quit">放棄</a>するコマンドだ。</li></ul>
<h2><span class="mw-headline" id="Symbols">記号</span></h2>
<p>コンソール版では次のようになる。
</p>
<ul><li><b>q</b> は<a href="/List_of_deep_dwarves" title="List of deep dwarves">闇ドワーフ</a>を表す。</li>
<li><b>Q</b> は以前は女王蜂や女王アリに使われていたが、いまは使われていない。</li></ul>
