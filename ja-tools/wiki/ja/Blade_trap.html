</p><p><b>刃の罠</b>は機械仕掛けの<a href="/Trap" title="Trap">罠</a>で、踏むと巨大な刃が振り上がって切りつけてきた。当たるとプレイヤーは 48〜76 の物理ダメージを受けた(モンスターは 10〜38 しか受けない)。機械仕掛けの罠のなかでいちばん強力で、近くでは十分に用心する価値があった。ほかの機械仕掛けの罠と違って弾を使わず、壊すこともできなかった。
</p>
