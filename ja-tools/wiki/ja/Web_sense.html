<p><b>巣の振動の察知</b>のフラグを持つモンスターは、10 マス以内の<a href="/Web" title="Web">蜘蛛の巣</a>の罠にプレイヤーがかかるたびにそれに気づき<sup id="cite_ref-1" class="reference"><a href="#cite_note-1">&#91;1&#93;</a></sup>、揺れのもとへふらふらと向かってくることがある。<sup id="cite_ref-2" class="reference"><a href="#cite_note-2">&#91;2&#93;</a></sup>
</p>
