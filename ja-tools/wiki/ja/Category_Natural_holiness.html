<p>「生物」はモンスターの基本的な<a href="/Holiness" title="Holiness">分類</a>のひとつで、現実の<a rel="nofollow" class="external text" href="http://en.wikipedia.org/wiki/Animal">動物界</a>にあたる。生きている生き物(つまり<a href="/Undead" title="Undead">アンデッド</a>でも<a href="/Nonliving" title="Nonliving">非生物</a>でもないもの)のうち、<a href="/Plants" class="mw-redirect" title="Plants">植物</a>、<a href="/Holy" title="Holy">神聖</a>、<a href="/Demonic" class="mw-redirect" title="Demonic">悪魔</a>のどれでもないものはすべてこれに含まれる。
