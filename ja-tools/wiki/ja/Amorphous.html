</i>
<p><b>不定形</b>のクリーチャーには、決まった形や姿がない。<a href="/List_of_jellies" title="List of jellies">ジェリー類</a>や、<a href="/Water_elemental" title="Water elemental">水の精霊</a>・<a href="/Elemental_wellspring" title="Elemental wellspring">精霊の源泉</a>のような液体の精霊がこれにあたる。<a href="/Throwing_net" title="Throwing net">投げ網</a>、<a href="/Web" title="Web">蜘蛛の巣</a>、<a href="/Throw_Bolas" title="Throw Bolas">ボーラの投擲</a>による移動不能(-Move)、<a href="/Constriction" title="Constriction">締め付け</a>が効かない。また、石化していなければ<a href="/Shatter" title="Shatter">粉砕</a>から受けるダメージが小さくなる。
</p><p><a href="/Aqua_Form" class="mw-redirect" title="Aqua Form">水化</a>しているプレイヤーも不定形になる。
</p><p><a href="/Category:Amorphous_monsters" title="Category:Amorphous monsters">不定形のモンスターの一覧</a>
