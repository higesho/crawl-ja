<p><b>ツキマーの舞踏会</b>はモンスター専用の呪文で、あなたの<a href="/Line_of_sight" title="Line of sight">視界</a>にある武器をすべて敵対的な<a href="/Dancing_weapon" title="Dancing weapon">宙を舞う武器</a>に変える。<a href="/Curse" title="Curse">呪われた</a>武器に<a href="/Tukima%27s_Dance" title="Tukima&#39;s Dance">ツキマーの舞踏</a>をかけたときと同じことが起きるわけだ。唱えるのは<a href="/Terpsichore" title="Terpsichore">テルプシコラー</a>だけだ(テルプシコラーも<a href="/Obsolete" title="Obsolete">廃止</a>されている)。
