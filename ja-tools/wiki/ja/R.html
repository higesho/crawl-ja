<h2><span class="mw-headline" id="Commands">コマンド</span></h2>
<ul><li><b>r</b> は<a href="/Scroll" title="Scroll">巻物</a>を読むコマンドだ。</li>
<li><b>R</b> は<a href="/Jewellery" title="Jewellery">装身具</a>を外すコマンドだ。</li></ul>
<h2><span class="mw-headline" id="Symbols">記号</span></h2>
<p>コンソール版では次のようになる。
</p>
<ul><li><b>r</b> は<a href="/Rat" title="Rat">ネズミ</a>系のモンスターを表す。</li>
<li><b>R</b> は<a href="/Efreet" title="Efreet">イフリート</a>や<a href="/Rakshasa" title="Rakshasa">ラクシャーサ</a>のような、神話に出てくる生き物を表す。</li></ul>
<h2><span class="mw-headline" id="History">変更履歴</span></h2>
<ul><li><a href="/0.22" title="0.22">0.22</a> より前は、呪文書を読むのもこのコマンドだった。</li>
<li><a href="/0.13" title="0.13">0.13</a> より前は、<a href="/Manual" title="Manual">虎の巻</a>は読んで使う必要があった。</li></ul>
