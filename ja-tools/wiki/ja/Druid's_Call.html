<p><b>ドルイドの呼び声</b>はモンスター専用の呪文で、生物で知能が動物並みのモンスターの群れをランダムに一つ選び、術者のもとへ瞬間移動させる。<a href="/Word_of_Recall" title="Word of Recall">招集の宣言</a>と違い、効果はすぐに現れる。
</p><p>ドルイドの呼び声を唱える敵は次のとおり。
