<p><b>他者の再生</b>はモンスター専用の呪文で、味方のモンスターに再生の効果をかけ、毎ターン最大 HP の5%+3 HP<sup id="cite_ref-1" class="reference"><a href="#cite_note-1">&#91;1&#93;</a></sup>を回復させる。<a href="/0.34" title="0.34">0.34</a>の時点でこの呪文を使うのは、<a href="/Beogh" title="Beogh">ベオ</a>の使徒の一部だけだ。
