<p>歪みのカードを引くと、プレイヤーが<a href="/Blink" title="Blink">瞬間移動</a>する。
</p>
<ul><li> 威力の段階 0: 行き先がランダムな瞬間移動</li>
<li> 威力の段階 1: ある程度制御できる(方向を選べる)瞬間移動</li>
<li> 威力の段階 2: 行き先を選べる瞬間移動(<a href="/Teleport_control#-cTele" title="Teleport control">-cTele</a> の階ではランダム)</li></ul>
