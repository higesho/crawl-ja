<h2><span class="mw-headline" id="Commands">コマンド</span></h2>
<ul><li><b>i</b> を押すと、持ち物の一覧が出る。</li>
<li><b>I</b> を押すと、覚えている呪文の一覧が出る。</li></ul>
<h2><span class="mw-headline" id="Symbols">記号</span></h2>
<p>コンソール版では次のようになる。
</p>
<ul><li><b>i</b> は<a href="/List_of_spriggans" title="List of spriggans">スプリガン</a>系のモンスターを表す。</li>
<li><b>I</b> は<a href="/Ice_beast" title="Ice beast">氷の獣</a>か<a href="/Sky_beast" title="Sky beast">雷雲の獣</a>を表す。</li></ul>
