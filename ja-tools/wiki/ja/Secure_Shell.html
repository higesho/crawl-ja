<p><b>Secure Shell</b>(SSH)は、ネットワークでつながった2台の機器のあいだで、安全な通信路を使ってデータをやりとりするためのネットワークプロトコルだ。Secure Shell は圧縮に GNU ZLIB(LZ77)を使う。圧縮すると帯域の消費が減り、CPU の負荷との兼ね合いで、全体としては速くなる。多くのオンラインサーバーが対応している(<a rel="nofollow" class="external text" href="http://crawl.develz.org/wordpress/howto">サーバーと SSH 鍵の一覧</a>)。
</p><p>*NIX を使っていて、SSH のメインのログインで毎回パスワードを打つのに飽きたなら、<a href="/Devteam" class="mw-redirect" title="Devteam">sorear</a> の <a rel="nofollow" class="external text" href="http://angband.pl/crawl/config">$HOME/.ssh/config</a> をコピーするといい。
</p>
