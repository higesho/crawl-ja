<p><b>霊の遠吠え</b>はモンスター専用の呪文で、相手に「遠吠」の<a href="/Status_effect" class="mw-redirect" title="Status effect">状態異常</a>をかける。この状態のあいだは<a href="/Spirit_wolves" class="mw-redirect" title="Spirit wolves">霊の狼</a>が次々に湧き出し、最短の道筋でこちらを追ってくる。やがて状態異常が切れると、そのとき<a href="/Line_of_sight" title="Line of sight">視界</a>にいない霊の狼はすべて消える。また、1 回のゲームで相手にする霊の狼の数には決まった上限がある。
</p><p>霊の遠吠えを唱える敵は次のとおり。
</p>
<ul><li><a href="/Spirit_wolf" title="Spirit wolf">霊の狼</a></li></ul>
