<p><a class="mw-selflink selflink">呪い感知の巻物</a>を読むと、持ち物の中のすべての装備品について、<a href="/Cursed" title="Cursed">呪われている</a>かどうかがわかる。呪われたアイテムが 1 つでも見つかれば、この巻物は識別される。
</p>
<h2><span class="mw-headline" id="Strategy">戦略</span></h2>
<p>未識別の装備で持ち物がいっぱいのときに呪い感知の巻物を 1 枚使えば、何十ものアイテムをまとめて試しに装備しても大丈夫かどうかがわかる。ただし、呪われていなくても危ないアイテムがあることは忘れないこと(<a href="/Distortion" title="Distortion">歪曲</a>、<a href="/Vampiricism" class="mw-redirect" title="Vampiricism">吸血</a>、<a href="/Plutonium_Sword" class="mw-redirect" title="Plutonium Sword">+GLOW</a>)。
</p>
