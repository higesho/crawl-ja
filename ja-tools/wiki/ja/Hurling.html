<p><b>投擲</b>は<a href="/Gloves" title="Gloves">手袋</a>にしか付かない<a href="/Ego" title="Ego">エゴ</a>で、<a href="/Throwing#Weapons" title="Throwing">投擲武器</a>で戦う力を高める。<a href="/Slaying" title="Slaying">殺戮</a>のボーナスが +4 つく。
</p>
<h2><span class="mw-headline" id="Desirability">評価</span></h2>
<p>殺戮のボーナスはいつでもありがたいが、投擲武器を使うことになるキャラクターばかりではない。呪文使いなら<a href="/Strength" title="Strength">腕力</a>や<a href="/Dexterity" title="Dexterity">器用</a>の手袋のほうを選ぶだろうし、<a href="/Ranged_weapon" class="mw-redirect" title="Ranged weapon">射撃武器</a>の使い手には必要ないかもしれない。
</p>
