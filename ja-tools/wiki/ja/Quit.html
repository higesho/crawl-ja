<p><a class="mw-selflink selflink">放棄</a>は、今のゲームを終わらせるコマンドで、<b>Ctrl-q</b> か <b>*-q</b> で行う。効果は<a href="/Death" title="Death">死んだ</a>ときと同じで、そのキャラクターで続きを遊ぶことはもうできない! 今回のプレイを中断してあとで再開したいだけなら、ゲームを<a href="/S" title="S">セーブ</a>しなければならない。
</p><p>放棄すると、いつもの持ち物とスコアの画面が表示され、ハイスコアの一覧にはゲームの終わり方が「ゲームを放棄した」と記録される。
</p><p>うっかり放棄してしまわないように、放棄するときは「yes」と入力するよう求められる。
</p>
