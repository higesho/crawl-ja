<p><b>スカラベの召喚</b>はモンスター専用の呪文で、<a href="/Death_scarab" title="Death scarab">死の太陽虫</a>を何匹か呼び出す。
</p><p>スカラベの召喚を唱える敵は次のとおり。
</p>
<ul><li> <span class="nhsym">M</span> <a href="/File:Khufu.png" class="image"><img alt="Khufu.png" src="/images/6/69/Khufu.png" width="32" height="32" /></a> <b><a href="/Khufu" title="Khufu">クフ王</a></b></li>
<li> <span class="nhsym clr-white">M</span> <a href="/File:Royal_mummy.png" class="image"><img alt="Royal mummy.png" src="/images/6/6e/Royal_mummy.png" width="32" height="32" /></a> <b><a href="/Royal_mummy" title="Royal mummy">王族のミイラ</a></b></li></ul>
<p>クフ王と王族のミイラがこの呪文で呼び出した生き物を同時に維持できるのは、8 体までだ。
</p>
