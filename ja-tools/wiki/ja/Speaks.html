<p>「<b>話す</b>」フラグは、意思を伝える能力を持つモンスターにつく。話せるのは知能のあるモンスターだけで、次のような場面でしゃべることがある。
</p>
<ul><li>キャラクターを初めて見つけたとき</li>
<li>戦いが長引いたとき、一定の間隔で</li>
<li>呪文や特殊能力を使うとき</li>
<li>混乱しているとき(たいていは意味不明なことを口走る!)</li></ul>
<p><a href="/Unique_monster" title="Unique monster">ユニークモンスター</a>の多くは話せる。魔法使いを食べて知能を得た巨大なナメクジ、<a href="/Gastronok" title="Gastronok">ガストロノク</a>もそのひとりだ!
</p>
