<p><b>良品</b>(good item)とは、平均より良いものが出やすいように重み付けされたアイテム(強化値が高い、基本の種類が上等、など)のことだ。マップやヴォールトの定義では、このアイテムは記号 <b>*</b> で表される。アイテムレベルは 5 + 2*item_level になる。つまり迷宮:5 の良品は、迷宮:15 で出る普通のアイテムと変わらない。
</p>
