</i>
<p><b>お誂え向きの球体(orb of appropriateness)</b>は、<a href="/The_Realm_of_Zot" title="The Realm of Zot">ゾットの領域</a>に出る球体のモンスターを指す、ゲーム内部での呼び名だ。
</p>
<ul><li><span class="nhsym">*</span> <a href="/File:Orb_of_fire.png" class="image"><img alt="Orb of fire.png" src="/images/7/7b/Orb_of_fire.png" width="32" height="32" /></a> <b><a href="/Orb_of_fire" title="Orb of fire">炎の球体</a></b></li>
<li><span class="nhsym">*</span> <a href="/File:Orb_of_winter.png" class="image"><img alt="Orb of winter.png" src="/images/7/73/Orb_of_winter.png" width="32" height="32" /></a> <b><a href="/Orb_of_winter" title="Orb of winter">冬の球体</a></b></li>
<li><span class="nhsym clr-darkgray">*</span> <a href="/File:Orb_of_entropy.png" class="image"><img alt="Orb of entropy.png" src="/images/e/ec/Orb_of_entropy.png" width="32" height="32" /></a> <b><a href="/Orb_of_entropy" title="Orb of entropy">エントロピーの球体</a></b></li></ul>
<p>1回のゲームでゾットの領域に出る球体は1種類だけで、どれが出るかは<a href="/Temple" class="mw-redirect" title="Temple">諸宗派の寺院</a>とゾットの領域の入口のまわりにある像で分かる。像を見たあとなら、ダンジョンの概要の画面(ctrl-o)でも、分岐の一覧の下にそのゲームで出る球体の種類が書かれている。
</p><p>なお、<a href="/Ziggurat" title="Ziggurat">ジグラット</a>にはこの制限がなく、どの種類の球体も出てくる。
</p>
