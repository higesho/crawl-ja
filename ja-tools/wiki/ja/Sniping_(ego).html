<h2><span class="mw-headline" id="Desirability">評価</span></h2>
<p>隠密が少しでもあれば、かなりの数の敵を、眠っているうちに画面の端から狙撃できるはずだ。呪術や悪臭の雲、スフィンクスの姉妹と組み合わせれば、射撃キャラの火力をぐんと引き上げられる。
