<p><b>透明化のワンド</b>を振ると、対象は一時的に<a href="/Invisible" title="Invisible">透明</a>になる。効果は<a href="/Invisibility" title="Invisibility">透明化</a>の呪文とほぼ同じで、プレイヤーに使うと、すぐに 1〜2 ポイントの<a href="/Magic_contamination" title="Magic contamination">魔力汚染</a>を受け、効果が続くあいだも少しずつ汚染がたまっていく。最初の汚染が無いぶん、<a href="/Potions_of_invisibility" class="mw-redirect" title="Potions of invisibility">透明化の薬</a>のほうが透明化の<a href="/Wand" title="Wand">ワンド</a>より少し優れている。このワンドはめったに見つからない。充填回数は最大 9 回だ。
</p>
