<p><b>墨の雲</b>はモンスター専用の逃走用の呪文で、<a href="/Scroll_of_fog" title="Scroll of fog">煙幕の巻物</a>に似たはたらきをする。<a href="/Water" title="Water">水</a>の上をすぐに消える墨の<a href="/Cloud" title="Cloud">雲</a>で満たしてあなたの<a href="/Line_of_sight" title="Line of sight">視界</a>をさえぎり、そのすきに術者は逃げていく。ほかの種類の雲と違って、墨の雲は水の上にしか広がらない。
</p><p>墨の雲を唱える敵は次のとおり。
