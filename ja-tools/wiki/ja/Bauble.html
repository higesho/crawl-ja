<p><b>ボーブル</b>は消耗品で、発動(<b>V</b>)すると一時的に決まった姿に変身する。<a href="/Talisman" title="Talisman">タリスマン</a>とちがって、使うのにかかるのは 1.0 <a href="/DecaAut" class="mw-redirect" title="DecaAut">ターン</a>だけだ。
</p>
