<p><b>酸の飛沫</b>は、狙った相手に<a href="/Acid" title="Acid">酸</a>の塊を飛ばしてダメージを与え、腐食させることもある。<a href="/Oklob_plant" title="Oklob plant">オクロブ草</a>や<a href="/Acid_blob" title="Acid blob">酸のブロブ</a>などが持つ<a href="/Spit_Acid" title="Spit Acid">酸の唾</a>の能力に似ているが、こちらは狙った相手の隣にいる生き物にも飛び散ることがある。
