<p>術者が手にした剣に、命を奪うほどの鋭さを一時的に与える呪文。ほかの特別な魔力が付いた武器には効かない。
術者が持っている<a href="/Weapon" title="Weapon">武器</a>にまだ<a href="/Brand" title="Brand">ブランド</a>が付いていなければ、一時的に<a href="/Vorpal" title="Vorpal">ヴォーパル</a>のブランドが付く。
