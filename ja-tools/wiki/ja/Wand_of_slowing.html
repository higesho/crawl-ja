<p><b>減速のワンド</b>を使うと、相手 1 体を数ターンのあいだ<a href="/Slow" title="Slow">減速</a>させようとする。減速した相手は、移動にも攻撃にもふだんの 1.5 倍の時間がかかる。そのぶん逃げるのがずっと楽になり、戦闘で受けるダメージも大きく減る。効果が出るには相手の<a href="/Magic_resistance" class="mw-redirect" title="Magic resistance">魔法抵抗</a>を上回る必要があるが、<a href="/Evocations" title="Evocations">発動</a>スキルが高いほど成功しやすくなる。
</p>
