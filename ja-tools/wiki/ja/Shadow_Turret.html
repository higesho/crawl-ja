<p><b>影の砲塔</b>はモンスター専用の呪文で、プレイヤーが<a href="/Forgecraft" title="Forgecraft">鍛造術</a>の系統の呪文を唱えたときに、<a href="/Dithmenos" title="Dithmenos">ディスメノス</a>の影の模倣で現れる影が唱える。その場から動かない味方のモンスター、影の砲塔を作り出す。砲塔は<a href="/Shadow_Shot" title="Shadow Shot">影の射撃</a>を繰り返し撃つ。同時に召喚できるのは2基までだ。
