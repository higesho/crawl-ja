<p><b>影の人形</b>はモンスター専用の呪文で、プレイヤーが<a href="/Summoning" class="mw-redirect" title="Summoning">召喚術</a>の系統の呪文を唱えたときに、<a href="/Dithmenos" title="Dithmenos">ディスメノス</a>の影の模倣で現れる影が唱える。急降下・回り込み・締めつけの攻撃を持つ弱い味方を召喚する。基本ダメージは呪文の威力に応じて上がる。同時に召喚できるのは3体までだ。
