<p><b>種類</b>(type)はモンスターの種を指す。どのモンスターにも、系統(そのモンスターが含まれる大まかなグループ)と種の両方がある。同じ系統のモンスターは同じ文字で表される。
</p><p>同じ系統のモンスターは、知能に関係なく、あなたを取り囲めるよう互いに道を譲り合う。また、味方を助ける呪文を持つモンスターは、たいてい同じ系統のモンスターにしかそれをかけられない(<a href="/Meliai" title="Meliai">メリアイ</a>が回復できるのは<a href="/Killer_bee" title="Killer bee">殺人蜂</a>と<a href="/Queen_bee" title="Queen bee">女王蜂</a>だけ、<a href="/Deep_troll_shaman" title="Deep troll shaman">洞窟トロルの祈祷師</a>が<a href="/Might_Other" title="Might Other">他者の強化</a>と<a href="/Haste_Other" title="Haste Other">他者の加速</a>をかけられるのはほかのトロルだけ、<a href="/Orc_knight" title="Orc knight">オークの騎士</a>の<a href="/Battlecry" title="Battlecry">闘争の喊声</a>が効くのはほかの<a href="/List_of_orcs" title="List of orcs">オーク</a>だけ、など)。この決まりには<a href="/Ironbound_convoker" title="Ironbound convoker">鉄縛の招集者</a>のような例外もある。
</p>
