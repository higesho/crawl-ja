<p>甲羅を持つ一部のモンスターは、深手を負うと<b>引きこもる</b>。身を守るために甲羅の中へ閉じこもるのだ。この状態のあいだは攻撃をやめ、体力の回復に努める。<a href="/AC" class="mw-redirect" title="AC">AC</a>に+10の補正がつき、HP の<a href="/Regeneration_rate" title="Regeneration rate">回復速度</a>も上がるが、その場から動かず、攻撃もしてこない。回復するまで放っておけばいずれ戦いに戻ってくるが、たいていはそうなる前に簡単にとどめを刺せる。
</p><p>この能力を使うモンスターは次のとおり。
