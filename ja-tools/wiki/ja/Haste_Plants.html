<p><b>植物の加速</b>はモンスター専用の呪文で、術者の<a href="/Line_of_sight" title="Line of sight">視界</a>にいる、<a href="/Holiness" title="Holiness">分類</a>が<a href="/Plant" title="Plant">植物</a>のモンスターすべてを<a href="/Haste" title="Haste">加速</a>させ、あらゆる行動にかかる時間を33%減らす。
</p><p>今のところ、植物の加速を唱えられるモンスターはいない。
</p>
<h2><span class="mw-headline" id="History">変更履歴</span></h2>
<p>植物の加速は<a href="/0.13" title="0.13">0.13</a>で追加された。おそらく<a href="/Enchanted_Forest" title="Enchanted Forest">魔法の森</a>の分岐を見越してのことだったが、この呪文を唱えられる唯一のモンスター(<a href="/Spriggan_druid" title="Spriggan druid">スプリガンのドルイド</a>)の呪文の組み合わせが変わったときに削除された。
</p>
