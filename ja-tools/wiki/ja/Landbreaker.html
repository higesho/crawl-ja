<p><b>大地砕き</b>はモンスター専用の呪文だ。複数の相手に耐性で防げないダメージを与え、相手の背後と、そのまわりのランダムなマスに<a href="/Pile_of_debris" title="Pile of debris">瓦礫の山</a>を置く。おかげで<a href="/Mountainshell" title="Mountainshell">山甲羅</a>から逃げるのが難しくなる。
</p><p>大地砕きを唱える敵は次のとおり。
