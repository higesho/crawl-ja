<p><b>朦朧への耐性</b>は一時的な状態で、しばらくのあいだ<a href="/Sleep" title="Sleep">睡眠</a>、<a href="/Paralysis" title="Paralysis">麻痺</a>、<a href="/Vex" title="Vex">苛立ち</a>を受けつけなくなる。
</p><p>苛立ちや麻痺の状態になると 1〜3 ターンの朦朧への耐性を得る。眠りから覚めたあとの耐性は 3〜5 ターン続く。また、<a href="/Petrified" class="mw-redirect" title="Petrified">石化</a>したプレイヤーは朦朧にならない。これで麻痺と石化を連鎖させるコンボを防いでいる。
</p>
<h2><span class="mw-headline" id="History">変更履歴</span></h2>
<ul><li>朦朧への耐性は <a href="/0.33" title="0.33">0.33</a> で導入された。それより前のバージョンでは、睡眠と麻痺にはそれぞれ状態が切れたあとの耐性があった(苛立ちはまだ存在しなかった)。</li></ul>
