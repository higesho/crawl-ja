<h2><span class="mw-headline" id="Commands">コマンド</span></h2>
<ul><li><b>j</b> を押すと、下へ 1 マス移動する。</li>
<li><b>shift+j</b> を押すと、<a href="/Monster" title="Monster">モンスター</a>など気になるものに出くわすまで、この方向へ移動しつづける。</li></ul>
<h2><span class="mw-headline" id="Symbols">記号</span></h2>
<p>コンソール版では次のようになる。
</p>
<ul><li><b>J</b> は<a href="/List_of_jellies" title="List of jellies">ジェリー</a>系のモンスターを表す。</li></ul>

</p>
