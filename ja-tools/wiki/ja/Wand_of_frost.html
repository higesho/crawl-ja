<p><b>霜のワンド</b>の効果は呪文の<a href="/Throw_Frost" title="Throw Frost">冷気の投射</a>と同じだが、射程が長く、命中率も高い。ダメージは<a href="/Evocations" title="Evocations">発動</a>スキルに応じて上がるものの、たいした威力にはならない。<a href="/Wand_of_cold" title="Wand of cold">冷気のワンド</a>には劣る。充電は最大で 48 回分まで。
</p>
