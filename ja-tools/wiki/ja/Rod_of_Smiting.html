<p><b>打擲のロッド</b>を発動すると、<a href="/LOS" class="mw-redirect" title="LOS">視界</a>にいる敵を一体選んで打ち据えることができる。この攻撃は、レベル 4 の<a href="/Smiting" title="Smiting">打擲の一撃</a>の呪文として扱われる。ダメージはそれほどでもないが、仲間の陰に隠れた敵にも当たり、逃げていくモンスターを仕留めるのに役立つ。
</p>
