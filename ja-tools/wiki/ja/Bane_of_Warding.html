<p>守護の災厄は、モンスターの群れを初めて見たときに、低い確率でその群れに「守護」の強化効果をかける<a href="/Bane" title="Bane">災厄</a>だ。守護がかかったモンスターは、隣接していない相手からのダメージを一切受けない。
