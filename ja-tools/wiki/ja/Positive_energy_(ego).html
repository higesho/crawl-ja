<h2><span class="mw-headline" id="Strategy">戦略</span></h2>
<p>場面によってはとても役に立つが、<a href="/Fire" title="Fire">火炎</a>耐性や<a href="/Cold" title="Cold">冷気</a>耐性のほうがずっと大事だ。<a href="/Shadow_dragon" title="Shadow dragon">シャドウドラゴン</a>など、たちの悪い<a href="/Draining" title="Draining">衰弱</a>の元を相手にするときは、正の力の装備に持ち替えることを考えるとよい。
</p>
