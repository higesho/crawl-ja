<p><b>紙の巻物</b>は白紙の<a href="/Scroll" title="Scroll">巻物</a>だ。識別する前は何か書いてあるように見えるのに、実際には何も書かれていない。読んでも 1 ターン無駄になるだけで、ほかには何も起きない。<a href="/Spellcasting" title="Spellcasting">呪文詠唱</a>スキルを鍛えるのにも使えない。
