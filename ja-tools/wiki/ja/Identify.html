<p><b>鑑定</b>(Identify)は<a href="/Divinations" title="Divinations">占術</a>の呪文で、アイテムを完全に鑑定できた。<a href="/Potion" title="Potion">薬</a>や<a href="/Scroll" title="Scroll">巻物</a>、呪われているかもしれない装備を、試しに使ってみて正体を探る危険を冒さずに済んだ。この鑑定では、身につけただけでは一部しかわからないアーティファクトの固有の性質も、すべて明らかになった。
</p><p>この呪文はもう唱えられないが、<a href="/Scroll_of_identify" title="Scroll of identify">鑑定の巻物</a>を読めば同じ効果が得られる。
</p>
