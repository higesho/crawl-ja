<p>狩られる者の災厄は、敵が召喚したクリーチャーがプレイヤーのすぐ隣に現れ、長く居座り、プレイヤーを追いかけるのもうまくなる<a href="/Bane" title="Bane">災厄</a>だ。影響を受けるのは召喚されたモンスターだけである。
