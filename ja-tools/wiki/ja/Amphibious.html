</i>
<p><b>水陸両生</b>のクリーチャーは、陸の上でも水の中でも同じように動ける。<a href="/List_of_merfolk" title="List of merfolk">水棲の民</a>、<a href="/Sea_snake" title="Sea snake">ウミヘビ</a>、<a href="/Alligator" title="Alligator">アリゲーター</a>などがこれにあたる。
</p>
<ul><li>水の中で移動しても戦っても不利にならず(ただし<a href="/Invisible" title="Invisible">透明</a>でも水の中では姿が見えてしまう)、<a href="/Deep_water" title="Deep water">深い水</a>を泳いで渡れる。</li>
<li><a href="/Drowning" class="mw-redirect" title="Drowning">溺水</a>や窒息のダメージ、<a href="/Engulf" title="Engulf">包み込み</a>が効かない。</li></ul>
<p>水陸両生のプレイヤー種族は、<a href="/Merfolk" title="Merfolk">水棲の民</a>、<a href="/Octopode" title="Octopode">オクトポード</a>、灰色<a href="/Draconian" title="Draconian">ドラコニアン</a>、<a href="/Barachi" title="Barachi">バラチ</a>だ。生まれつき水陸両生の<a href="/Species" title="Species">種族</a>なら、深い水にアイテムを落としてもなくならない。この利点は、変身して水陸両生になった場合には得られない。
</p>
