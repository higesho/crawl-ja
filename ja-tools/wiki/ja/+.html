<h2><span class="mw-headline" id="Commands">コマンド</span></h2>
<ul><li><b>+</b> を押すと、死んでも生き返れるモードである<a href="/Explore_mode" title="Explore mode">探索モード</a>に入るかどうかを聞かれる。サーバーや<a href="/Rcfile" class="mw-redirect" title="Rcfile">設定ファイル</a>で無効にされているときは、何も起こらない。</li></ul>
<h2><span class="mw-headline" id="Symbols">記号</span></h2>
<p>コンソール版では次のようになる。
</p>
<ul><li><b>+</b> は閉じた<a href="/Door" title="Door">扉</a>を表す。</li></ul>
