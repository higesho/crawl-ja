<p><i>今もゲームにある防具の重さについては、<a href="/Encumbrance_rating" title="Encumbrance rating">重さの値</a>を参照。</i>
</p><p>重量超過は、<code>100 + (25 * strength)</code> <a href="/Aum" class="mw-redirect" title="Aum">aum</a> より多くの荷物を持ったときにかかる<a href="/Status_effect" class="mw-redirect" title="Status effect">状態異常</a>だった(strength は腕力)。次のような効果があった。
</p>
<ul><li><a href="/Stairs" title="Stairs">階段</a>の昇り降りに1ターン余計にかかる</li>
<li><a href="/Movement" title="Movement">移動</a>のディレイが +1</li>
<li>行動ごとの<a href="/Hunger" class="mw-redirect" title="Hunger">空腹</a>が +2</li>
<li><a href="/Stealth" title="Stealth">隠密</a>が半分になる</li>
<li><a href="/Unarmed_Combat" title="Unarmed Combat">徒手格闘</a>が遅くなる</li></ul>
