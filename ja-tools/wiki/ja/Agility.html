<p><b>器用強化</b>(Agility)は、<a href="/Evasion" title="Evasion">EV</a> を +5 する<a href="/Status_effect" class="mw-redirect" title="Status effect">状態</a>だ。
</p><p><a href="/Demonspawn" title="Demonspawn">悪魔の血族</a>の変異<a href="/Powered_by_Pain" class="mw-redirect" title="Powered by Pain">苦痛よりの力</a>によって、器用強化の状態になることがある。<a href="/Chaos" title="Chaos">混沌</a>の効果で起こることもある。
</p>
<h2><span class="mw-headline" id="History">変更履歴</span></h2>
<ul><li><a href="/0.25" title="0.25">0.25</a> で、この状態のいちばんの入手手段だった<a href="/Potions_of_agility" class="mw-redirect" title="Potions of agility">器用さの薬</a>が<a href="/Potions_of_stabbing" class="mw-redirect" title="Potions of stabbing">急所攻撃の薬</a>に置き換えられた。あわせて、<a href="/Stealth" title="Stealth">隠密</a> +50 と<a href="/Dexterity" title="Dexterity">器用</a> +5 の効果がなくなり、器用強化が混沌の効果の一つになった。</li></ul>
