<p><b>エリンギャの驚きの花束</b>は、<i>Stone Soup</i> 以前のごく初期の <i>Dungeon Crawl</i> にだけあった呪文だ。唱えると、手に持っている木製のアイテムが食べられる花束に変わった。
</p><p>今の <i>Crawl</i> のプレイヤーでこの呪文を知っている人はまずいないが、<a href="/Eringya%27s_Noxious_Bog" title="Eringya&#39;s Noxious Bog">エリンギャの毒沼</a>が登場するまでは、最初期の<a href="/Wizard_Laboratory" title="Wizard Laboratory">魔術師の研究所</a>のひとつである<a href="/Eringya%27s_Formal_Garden" title="Eringya&#39;s Formal Garden">エリンギャの庭園</a>の由来を説明するものとして、歴史的に大事な意味を持ちつづけた。
</p>
