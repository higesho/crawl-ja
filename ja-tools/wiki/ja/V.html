<h2><span class="mw-headline" id="Controls">操作</span></h2>
<ul><li><b>v</b> を押すと、いま手にしている武器を<a href="/Evoke" class="mw-redirect" title="Evoke">発動</a>する(発動できる武器なら)。</li>
<li><b>V</b> を押すと、ワンドなど、持ち物の中の発動できるアイテムを発動できる。</li>
<li><b>Ctrl-V</b> を押すと、見えているモンスターが HP に応じた色で表示される。次のコマンドを入力すると、ふつうの色に戻る。</li></ul>
<h2><span class="mw-headline" id="Symbols">記号</span></h2>
<p>コンソール版では次のようになる。
</p>
<ul><li><b>v</b> はさまざまな<a href="/Insubstantial_wisp" title="Insubstantial wisp">霧</a>や<a href="/Fire_vortex" title="Fire vortex">渦</a>を表す。</li>
<li><b>V</b> はさまざまな<a href="/Vampire_(monster)" title="Vampire (monster)">吸血鬼</a>を表す。</li></ul>
