<p><b>調律</b>は<a href="/Orb" title="Orb">オーブ</a>にしか付かない<a href="/Ego" title="Ego">エゴ</a>だ。<a href="/Magical_staff" title="Magical staff">魔法の杖</a>を構えていると、オーブが杖の各系統に<a href="/Spell_enhancer" class="mw-redirect" title="Spell enhancer">呪文強化</a>をもう1段階ずつ足してくれる。さらに、杖での近接攻撃でMPが1-3回復する。
