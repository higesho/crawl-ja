<h2><span class="mw-headline" id="Desirability">評価</span></h2>
<p><b>生命力の指輪</b>はかなり役に立つ。元になる種類(再生)が優秀なうえに、ほかでは手に入らない追加の性質(HP の上乗せ)もまた優秀だからだ。たいていのキャラクターは、見つけたら身につけたくなるだろう。
</p>
